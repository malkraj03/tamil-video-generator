name: Generate Tamil Video & Upload to YouTube

on:
  # Twice daily schedule
  # 08:00 IST = 02:30 UTC
  # 20:00 IST = 14:30 UTC
  schedule:
    - cron: '30 2 * * *'
    - cron: '30 14 * * *'

  workflow_dispatch:
    inputs:
      resolution:
        description: 'Video resolution'
        required: false
        default: '1920x1080'
      skip_upload:
        description: 'Skip YouTube upload (for testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            fonts-noto \
            fonts-noto-cjk-extra \
            fonts-noto-extra \
            libsm6 \
            libxext6 \
            libxrender-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p audio_output videos images thumbnails temp

      - name: Generate video and upload to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          RESOLUTION=${{ github.event.inputs.resolution || '1920x1080' }}
          SKIP_UPLOAD=${{ github.event.inputs.skip_upload || 'false' }}

          ARGS="--resolution $RESOLUTION --fps 30"

          if [ "$SKIP_UPLOAD" = "true" ]; then
            ARGS="$ARGS --skip-upload"
          fi

          python generate_once.py $ARGS

      - name: Upload video artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_id }}
          path: |
            videos/*.mp4
            thumbnails/*.jpg
          retention-days: 3
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          rm -rf audio_output/* temp/*
